# 工作流名称
name: Sync-Images-to-ALIYUN-ACR
# 工作流运行时显示名称
run-name: ${{ github.actor }} is Sync Images to ALIYUN-ACR.
# 怎样触发工作流
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# 工作流程任务（通常含有一个或多个步骤）
jobs:
  syncimages:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repos
      uses: actions/checkout@v3

    # 1. 登录 Docker Hub (关键！解决拉取报错)
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        logout: false

    # 2. 登录 nvidia Hub (关键！解决拉取报错)
    - name: Login to nvidia Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        logout: false

    - name: Login to ALIYUN-ACR
      uses: docker/login-action@v3
      with:
        registry: crpi-cf3skza02u86mj4q.cn-chengdu.personal.cr.aliyuncs.com
        username: ${{ secrets.ALIYUN_USERNAME }}
        password: ${{ secrets.ALIYUN_PASSWORD }}
        logout: false 
        
    - name: Use Skopeo Tools Sync Image to ALIYUN-ACR
      run: |
        #!/usr/bin/env bash
        set -e
        
        # 2. 定义目标仓库前缀 (你的新命名空间)
        TARGET_REGISTRY="docker://crpi-cf3skza02u86mj4q.cn-chengdu.personal.cr.aliyuncs.com/hong_mirror_k8s"
        TARGET_REGISTRY_ARM64="docker://crpi-cf3skza02u86mj4q.cn-chengdu.personal.cr.aliyuncs.com/hong_mirror_k8s_arm"

        # 3. 定义同步函数 (核心逻辑)
        sync_image() {
          local source_image=$1
          local target_name=$2
          local target_tag=$3
          
          # 拼接完整的目标地址
          local full_target="$TARGET_REGISTRY/$target_name:$target_tag"

          echo "----------------------------------------------------"
          echo "🔍 Checking: $target_name:$target_tag"
          
          # 步骤 A: 检查阿里云是否已存在该镜像
          # 使用 $DEST_CREDS 凭证访问私有仓库
          if skopeo inspect "$full_target" > /dev/null 2>&1; then
            echo "✅ [SKIP] Image already exists, skipping."
          else
            echo "🚀 [SYNC] Image not found, starting copy..."
            echo "   Source: $source_image"
            echo "   Target: $full_target"
            
            # 步骤 B: 执行同步
            # --override-os/arch: 强制只同步 amd64，解决阿里云 Blob 复用报错
            # --all: 复制所有关联数据
            skopeo copy --override-os linux --override-arch amd64 --all \
              "docker://$source_image" \
              "$full_target"
              
            echo "🎉 [DONE] Sync completed."
          fi
        }

        sync_image_arm64() {
          local source_image=$1
          local target_name=$2
          local target_tag=$3
          local full_target="$TARGET_REGISTRY_ARM64/$target_name:$target_tag"
          if skopeo inspect "$full_target" > /dev/null 2>&1; then
            echo "✅ [SKIP] $target_name:$target_tag"
          else
            skopeo copy --override-os linux --override-arch arm64 \
              "docker://$source_image" "$full_target"
            echo "🎉 [DONE] $target_name:$target_tag (arm64)"
          fi
        }

        # ==================================================
        # 4. 执行同步清单 (包含所有依赖)
        # ==================================================

        sync_image "docker.io/huggingface/trl:1.10.0" "trl" "1.10.0"
        sync_image "docker.io/hiyouga/llamafactory:0.9.5" "llamafactory" "0.9.5"
        sync_image "docker.io/verlai/verl:vllm024.dev2" "verl" "vllm024.dev2"
        sync_image "docker.io/unsloth/unsloth:2026.5.9-pt2.10.0-vllm-0.16.0-cu12.8-studio-release-v0.1.43-beta-2026-MAY-31" "unsloth" "2026.5.9-pt2.10.0-vllm-0.16.0-cu12.8-studio-release-v0.1.43-beta-2026-MAY-31"
